<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移民案件期限与材料管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1080px; margin: auto; }
    button { padding: .5rem .85rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
    section { border: 1px solid #d9dee3; border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
    h2 { font-size: 1.05rem; margin: 0 0 .75rem; }
    label { font-size: .85rem; color: #4a5560; }
    input, select, textarea { padding: .4rem .5rem; border: 1px solid #c4ccd4; border-radius: 6px; font: inherit; }
    textarea { width: 100%; box-sizing: border-box; min-height: 3.2rem; }
    .muted { color: #6a7480; font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>移民案件期限与材料管理</h1>
  <div class="row">
    <label>调用身份 <select id="role">
      <option value="admin">admin</option>
      <option value="intake_officer">intake_officer（收案）</option>
      <option value="supervisor" selected>supervisor（主管）</option>
      <option value="case_officer">case_officer</option>
      <option value="legal_rep">legal_rep</option>
    </select></label>
    <button id="load">加载记录</button><button id="stats">状态统计</button>
  </div>

  <section>
    <h2>人员资料（亲属关系 / 共同公司）</h2>
    <div class="row">
      <label>人员ID <input id="p_id" placeholder="如 L-1"></label>
      <label>姓名 <input id="p_name" placeholder="如 李律师"></label>
      <label>亲属ID（逗号分隔）<input id="p_rel" placeholder="如 A-1"></label>
      <label>公司ID（逗号分隔）<input id="p_co" placeholder="如 CO-X"></label>
      <button id="p_save">保存人员</button>
      <button id="p_list">人员列表</button>
    </div>
  </section>

  <section>
    <h2>指派 / 换人（指派前自动利益冲突核验）</h2>
    <div class="row">
      <label>案件ID <input id="a_rid" placeholder="数字" style="width:6rem"></label>
      <label>版本 <input id="a_ver" placeholder="expected_version" style="width:8rem"></label>
      <label>动作 <select id="a_act">
        <option value="assign">assign 指派</option>
        <option value="reassign">reassign 换人</option>
        <option value="release_conflict">release_conflict 放行</option>
        <option value="reject_conflict">reject_conflict 驳回</option>
        <option value="reopen">reopen 重开</option>
      </select></label>
      <label>被指派人ID <input id="a_holder" placeholder="如 L-1"></label>
      <label>岗位 <select id="a_slot"><option value="legal_rep">律师</option><option value="assistant">协办</option></select></label>
    </div>
    <label>理由 / 备注（放行与驳回必须写明理由）</label>
    <textarea id="a_reason"></textarea>
    <div class="row"><button id="a_run">执行动作</button><span class="muted">命中冲突时案件停在 conflict_review（待复核），主管放行后才能继续。</span></div>
  </section>

  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
function headers() { return {"X-User-Id":"demo-" + document.getElementById("role").value, "X-Role":document.getElementById("role").value, "X-Org":"demo", "Content-Type":"application/json"}; }
async function show(resp) {
  const data = await resp.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
async function get(path) { await show(await fetch(path, {headers: headers()})); }
document.getElementById("load").onclick = () => get("/api/records?limit=20");
document.getElementById("stats").onclick = () => get("/api/stats");
document.getElementById("p_list").onclick = () => get("/api/persons");
document.getElementById("p_save").onclick = async () => {
  const list = v => v.split(",").map(s => s.trim()).filter(Boolean);
  const body = {person_id: document.getElementById("p_id").value.trim(),
    data: {name: document.getElementById("p_name").value.trim(),
           relative_ids: list(document.getElementById("p_rel").value),
           company_ids: list(document.getElementById("p_co").value)}};
  await show(await fetch("/api/persons", {method:"POST", headers: headers(), body: JSON.stringify(body)}));
};
document.getElementById("a_run").onclick = async () => {
  const action = document.getElementById("a_act").value;
  const reason = document.getElementById("a_reason").value.trim();
  const data = {};
  if (action === "assign" || action === "reassign") {
    data.holder_id = document.getElementById("a_holder").value.trim();
    data.slot = document.getElementById("a_slot").value;
    if (reason) data.note = reason;
  } else if (action === "release_conflict") {
    data.release_reason = reason;
  } else if (action === "reject_conflict") {
    data.reject_reason = reason;
  } else if (action === "reopen") {
    data.reopen_reason = reason;
  }
  const body = {expected_version: Number(document.getElementById("a_ver").value), data};
  const rid = document.getElementById("a_rid").value.trim();
  await show(await fetch(`/api/records/${rid}/actions/${action}`, {method:"POST", headers: headers(), body: JSON.stringify(body)}));
};
</script>
</body>
</html>
